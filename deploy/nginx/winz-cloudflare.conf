# Nginx origin for Cloudflare Proxied domain: winz.sreamart.com
# Cloudflare SSL mode must be "Full (Strict)" with the origin certificate below.
# Create the certificate in Cloudflare → SSL/TLS → Origin Server → Create Certificate.

server {
    listen 80;
    server_name winz.sreamart.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name winz.sreamart.com;

    ssl_certificate     /etc/ssl/cloudflare/winz.sreamart.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/winz.sreamart.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Backup/restore JSON can be large.
    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
