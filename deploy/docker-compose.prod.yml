# Production compose for a VPS.
# All sensitive ports are bound to 127.0.0.1 only; public access goes through
# Nginx reverse proxy on 80/443 (see nginx/winz.conf).
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8110:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - vendor:/var/www/html/vendor
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-winz}
      MYSQL_USER: ${MYSQL_USER:-winz}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: enable with --profile tools and reach it over an SSH tunnel.
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8098:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  dbdata:
  vendor:
